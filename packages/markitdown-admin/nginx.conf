server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 101m;
    client_body_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /v1 {
        return 308 /v1/;
    }

    location ^~ /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 930s;
        proxy_send_timeout 300s;
    }

    location = /health/live { proxy_pass http://api:8000/health/live; }
    location = /health/ready { proxy_pass http://api:8000/health/ready; }
    location = /openapi.json { proxy_pass http://api:8000/openapi.json; }
    location = /docs { proxy_pass http://api:8000/docs; }
    location = /docs/oauth2-redirect { proxy_pass http://api:8000/docs/oauth2-redirect; }
    location = /redoc { proxy_pass http://api:8000/redoc; }
    location = /verify { proxy_pass http://api:8000/verify; }
    location = /reset-password { proxy_pass http://api:8000/reset-password; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
