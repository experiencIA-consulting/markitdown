[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-api"
version = "0.1.0"
description = "Asynchronous REST API for MarkItDown document conversion"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "aiohttp>=3.11,<4",
  "magika>=0.6.1,<2",
  "markitdown>=0.1.9,<0.2.0",
  "psutil>=6,<8",
]

[project.optional-dependencies]
formats = ["markitdown[all]>=0.1.9,<0.2.0"]
ocr = [
  "markitdown-ocr[llm]>=0.1.0,<0.2.0",
  "openai>=1.0.0,<3",
]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_api"]

[tool.ruff.lint]
ignore = ["B008", "UP017"]
